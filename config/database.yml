default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: sqlql_sample_v2_development

test:
  <<: *default
  database: sqlql_sample_v2_test

production:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "sqlql_sample_v2_production") %>
